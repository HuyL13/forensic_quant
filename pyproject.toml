[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t2i-forensic-quant-pilot"
version = "0.1.0"
description = "Forensic quantization QAT pilot for dormant text-to-image visual fingerprints"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.2"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]